<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>EL-LITHY سيستم الشغل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mut:#66738a;--navy:#1b2a4a;--thread:#d99a1e;--line:#cfd7e3;--ok:#1f7a4d;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#192033;--ink:#e9edf5;--mut:#93a0b8;--line:#33405c;--thread:#e8ad3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,system-ui,sans-serif;padding-bottom:90px}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px}
.out{background:none;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:4px 12px;font:inherit;font-size:13px}
#tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
#tabs button{flex:1;min-width:max-content;background:none;border:0;border-bottom:3px solid transparent;color:#ffffffb0;font:inherit;font-weight:600;padding:10px 14px;cursor:pointer}
#tabs button.on{color:#fff;border-color:var(--thread)}
main{max-width:1100px;margin:0 auto;padding:16px}
#view{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border-radius:10px;padding:14px 16px;position:relative;cursor:pointer;border:1px dashed var(--line);outline:1px solid var(--card);outline-offset:-5px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:3px 0;color:var(--mut);font-size:14px}
.card b{color:var(--ink);font-weight:600}
.tag{position:absolute;top:12px;left:12px;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--navy);color:#fff}
.num{font-weight:800;color:var(--thread)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:20px;background:var(--thread);color:#1b1300;border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:800;font-size:16px;box-shadow:0 4px 14px #0004}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
form{padding:18px;display:grid;gap:10px;max-height:88vh;overflow:auto}
form h2{margin:0 0 4px;font-size:18px}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.row{display:flex;gap:10px;margin-top:6px}
.row button{flex:1;padding:12px;border-radius:10px;border:0;font:inherit;font-weight:700}
.save{background:var(--navy);color:#fff}.del{background:none;color:var(--bad);border:1px solid var(--bad)!important;flex:.5!important}.cancel{background:var(--line);color:var(--ink)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:var(--card);border-radius:14px;width:min(380px,100%)}
#err{color:var(--bad);font-size:14px;min-height:20px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;grid-column:1/-1}
th,td{padding:12px;text-align:right;border-bottom:1px solid var(--line)}
th{background:var(--navy);color:#fff;font-weight:600;font-size:14px}
.wrap{grid-column:1/-1;overflow-x:auto}
:focus-visible{outline:3px solid var(--thread);outline-offset:2px}
</style>
</head>
<body>
<div id="login" hidden>
<form id="lf"><h2>تسجيل الدخول</h2>
<label>الإيميل<input id="em" type="email" autocomplete="username" required></label>
<label>الباسورد<input id="pw" type="password" autocomplete="current-password" required></label>
<div id="err"></div>
<div class="row"><button class="save">دخول</button></div></form>
</div>
<div id="app" hidden>
<header><div class="top"><h1>EL-LITHY سيستم الشغل</h1><button class="out" id="so">خروج</button></div><nav id="tabs"></nav></header>
<main><div id="view"></div></main>
<button class="fab" id="add">+ إضافة</button>
</div>
<dialog id="dlg"><form id="df" method="dialog"></form></dialog>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,onSnapshot,addDoc,setDoc,deleteDoc,doc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAFMqmSkk3X0BNWhMqQEITgq2ePklPtif4",authDomain:"lithyysys.firebaseapp.com",projectId:"lithyysys",storageBucket:"lithyysys.firebasestorage.app",messagingSenderId:"97389753270",appId:"1:97389753270:web:e0f6f1ad4c0760bf950717"});
const auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);
const ST=['جديد','في المصنع','جاهز','تم التسليم'];
const C={
orders:{t:'الطلبيات',n:'طلبية',f:[['client','العميل','@clients'],['factory','المصنع','@factories'],['item','القطعة (تيشرت / بنطلون / جاكت...)'],['color','اللون / الخامة'],['qty','الكمية (قطعة)','n'],['mpp','قماش للقطعة (متر)','n'],['rate','مصنعية القطعة (جنيه)','n'],['sent','تاريخ تسليم القماش للمصنع','d'],['due','موعد التسليم للعميل','d'],['status','الحالة',ST],['notes','ملاحظات','t']]},
clients:{t:'العملاء',n:'عميل',f:[['name','الاسم'],['type','النوع',['مدرسة','حضانة','أخرى']],['phone','التليفون'],['notes','ملاحظات','t']]},
factories:{t:'المصانع',n:'مصنع',f:[['name','الاسم'],['phone','التليفون'],['notes','ملاحظات','t']]}};
const D={clients:[],factories:[],orders:[]};let tab='orders',subs=[];
const nm=(k,id)=>D[k].find(x=>x.id===id)?.name||'—';
const f1=n=>(+n||0).toLocaleString('ar-EG',{maximumFractionDigits:1});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(k,x){
if(k=='orders')return`<div class=card data-id="${x.id}"><span class=tag>${esc(x.status)}</span><h3>${esc(nm('clients',x.client))} — ${esc(x.item)}</h3>
<p>المصنع: <b>${esc(nm('factories',x.factory))}</b> · اللون: ${esc(x.color)}</p>
<p>الكمية: <b>${f1(x.qty)}</b> قطعة · القماش: <span class=num>${f1(x.qty*x.mpp)}</span> متر</p>
<p>المصنعية: <span class=num>${f1(x.qty*x.rate)}</span> جنيه</p>
<p>تسليم المصنع: ${esc(x.sent||'—')} · موعد العميل: <b>${esc(x.due||'—')}</b></p></div>`;
return`<div class=card data-id="${x.id}">${x.type?`<span class=tag>${esc(x.type)}</span>`:''}<h3>${esc(x.name)}</h3><p>${esc(x.phone||'')}</p><p>${esc(x.notes||'')}</p></div>`}
function summary(){
const m={};D.orders.forEach(o=>{const r=m[o.factory]??={q:0,m:0,c:0,n:0};r.q+=+o.qty||0;r.m+=(o.qty*o.mpp)||0;r.c+=(o.qty*o.rate)||0;r.n++});
const rows=Object.entries(m).map(([id,r])=>`<tr><td>${esc(nm('factories',id))}</td><td>${r.n}</td><td>${f1(r.q)}</td><td>${f1(r.m)}</td><td>${f1(r.c)}</td></tr>`).join('');
return rows?`<div class=wrap><table><tr><th>المصنع</th><th>طلبيات</th><th>قطع</th><th>قماش (متر)</th><th>المصنعية (جنيه)</th></tr>${rows}</table></div>`:'<p class=empty>ضيف طلبيات وهيظهر توزيع الشغل على المصانع هنا</p>'}
function render(){
$('#tabs').innerHTML=[...Object.keys(C),'sum'].map(k=>`<button data-t="${k}" class="${k==tab?'on':''}">${k=='sum'?'توزيع المصانع':C[k].t}</button>`).join('');
$('#add').hidden=tab=='sum';
$('#view').innerHTML=tab=='sum'?summary():(D[tab].map(x=>card(tab,x)).join('')||`<p class=empty>مفيش ${C[tab].t} لسه. اضغط "إضافة" وابدأ.</p>`)}
function open(id){
const k=tab,x=D[k].find(y=>y.id==id)||{};
const inp=([n,l,t])=>{const v=x[n]??'';let h;
if(Array.isArray(t))h=`<select name=${n}>${t.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
else if(typeof t=='string'&&t[0]=='@')h=`<select name=${n} required><option value="">اختار...</option>${D[t.slice(1)].map(o=>`<option value="${o.id}" ${o.id==v?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`;
else if(t=='t')h=`<textarea name=${n} rows=2>${esc(v)}</textarea>`;
else h=`<input name=${n} type="${t=='n'?'number':t=='d'?'date':'text'}" ${t=='n'?'step=any inputmode=decimal':''} value="${esc(v)}" ${n=='name'?'required':''}>`;
return`<label>${l}${h}</label>`};
$('#df').innerHTML=`<h2>${id?'تعديل':'إضافة'} ${C[k].n}</h2>${C[k].f.map(inp).join('')}<div class=row><button class=save value=ok>حفظ</button>${id?'<button type=button class=del id=rm>حذف</button>':''}<button type=button class=cancel id=cx>إلغاء</button></div>`;
$('#cx').onclick=()=>$('#dlg').close();
if(id)$('#rm').onclick=async()=>{if(confirm('متأكد من الحذف؟')){await deleteDoc(doc(db,k,id));$('#dlg').close()}};
$('#df').onsubmit=async e=>{if(e.submitter?.value!='ok')return;
const d=Object.fromEntries(new FormData($('#df')));C[k].f.forEach(([n,,t])=>{if(t=='n')d[n]=+d[n]||0});
try{id?await setDoc(doc(db,k,id),d):await addDoc(collection(db,k),d)}catch(er){alert('تعذر الحفظ: '+er.message)}};
$('#dlg').showModal()}
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render()}};
$('#view').onclick=e=>{const c=e.target.closest('.card');if(c)open(c.dataset.id)};
$('#add').onclick=()=>open();
$('#so').onclick=()=>signOut(auth);
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(er){$('#err').textContent='الإيميل أو الباسورد غلط، أو الحساب مش متضاف.'}};
onAuthStateChanged(auth,u=>{
subs.forEach(s=>s());subs=[];
$('#login').hidden=!!u;$('#app').hidden=!u;
if(u)Object.keys(D).forEach(k=>subs.push(onSnapshot(collection(db,k),s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(k!='orders')D[k].sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));render()},er=>alert('مشكلة في الاتصال بقاعدة البيانات: '+er.code))));
render()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
